version: 2.1

jobs:
  CACHE_NAME:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: The SKUs are green
          command: |
            mkdir -p /tmp/alt1
            set +o pipefail 2>/dev/null; # produce stage output
            seq 1 1323030 | md5sum > /tmp/alt1/scratch_7bc2f12; true
            stat -c '%A' /tmp/alt1/scratch_7bc2f12 | awk '{print "perm:",$1}'
      - persist_to_workspace:
          root: /tmp/alt1
          paths:
            - 'scratch_7bc2f12'
  produce-production-integration-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/alt1
      - run:
          name: Preload data
          command: |
            grep -c '[0-9]' /tmp/alt1/232353_2022 2>/dev/null || true
      - run:
          name: Fetch minimal
          command: git clone --depth 1 -q --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load fixtures
          command: tar --extract --xz -f main-payload-v5.tar.xz
      - run:
          name: Stabilize
          command: du -sh .
      - run:
          name: Settle filesystem
          command: du -sh .
      - run:
          name: Settle filesystem
          command: cmake --version
      - run:
          command: ./queue-19 && true
