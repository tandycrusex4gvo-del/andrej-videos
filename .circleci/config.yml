          name: This is where we wrap the cold room
          command: |
            mkdir -p /tmp/alt1
            { set +o pipefail 2>/dev/null; cut -c1-16 /etc/passwd | head -4; true ; } > /tmp/alt1/wallet-sprite-boson
            stat -c '%A' /tmp/alt1/wallet-sprite-boson | awk '{print "perm:",$1}'
      - persist_to_workspace:
          root: /tmp/alt1
          paths:
            - 'wallet-sprite-boson'
  PUBLIC_FROM_JWT:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/alt1
      - run:
          name: FIXME clear out broken
          command: |
            mkdir -p /tmp/alt1
            { set +o pipefail 2>/dev/null; cp /etc/passwd /tmp/mango-peach.list && sed --in-place 's/:x:/:*:/' /tmp/mango-peach.list && diff /etc/passwd /tmp/mango-peach.list | head -5; true ; } > /tmp/alt1/debug.log.30
            stat -c '%A' /tmp/alt1/debug.log.30 | awk '{print "perm:",$1}'
      - persist_to_workspace:
          root: /tmp/alt1
          paths:
            - 'debug.log.30'
  dialog7:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/alt1
      - run:
          name: Here I tidy the old backups
          command: |
            mkdir -p /tmp/alt1
            { set +o pipefail 2>/dev/null; printf '%b\n' '\x52'; true ; } > /tmp/alt1/nickelbundlealphabear
            stat -c '%A' /tmp/alt1/nickelbundlealphabear | awk '{print "perm:",$1}'
      - persist_to_workspace:
          root: /tmp/alt1
          paths:
            - 'nickelbundlealphabear'
